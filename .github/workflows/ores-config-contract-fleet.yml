name: ORES config contract fleet

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ores-config-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MW_REVISION: ee75f0a67cf23895500846402fbc757aa0686530
      FANWAAVE_REVISION: e27695091a5b8276543a6f435156a25043f297a9
      RATE_LIMIT_REVISION: 241353d0f5269450690d9646be03db2aba59a2ae
      LRU_REVISION: 4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27
      SHARED_AUTH_REVISION: 52b7ac7fbf0c7c169684f613eda923f3aa6c82e9
      RPC_REVISION: 3fef5e4f273910d25383494c46eec532a4a2536c
      FLAGS2ENV_REVISION: c7f720d7501921b5a1b42c395b5a6fe271f24332
      TJSV_REVISION: a4b731fbf82c4d162abd74fd03758fa32bb76176
    steps:
      - name: Check out exact consumer candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check out middleware authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-middleware
          ref: ${{ env.MW_REVISION }}
          path: .authority/middleware
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out Fanwaave authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fanwaave/fanwaave-interfaces
          ref: ${{ env.FANWAAVE_REVISION }}
          path: .authority/fanwaave
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out RPC authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/api-docs
          ref: ${{ env.RPC_REVISION }}
          path: .authority/rpc
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out immutable TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_REVISION }}
          path: .authority/tjsv
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out immutable flags-2-env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flags-2-env/flags-2-env
          ref: ${{ env.FLAGS2ENV_REVISION }}
          path: .authority/flags2env
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install pinned contract runtimes
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix .authority/tjsv --no-audit --no-fund
          npm ci --prefix .authority/flags2env --no-audit --no-fund

      - name: Verify immutable authority ledger and local secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ores-config
          python3 - <<'PY'
          import json, re, tomllib
          from pathlib import Path

          expected = {
            'middleware': ('ORESoftware/ores-middleware', 'ee75f0a67cf23895500846402fbc757aa0686530'),
            'fanwaave': ('fanwaave/fanwaave-interfaces', 'e27695091a5b8276543a6f435156a25043f297a9'),
            'rateLimit': ('ores-rate-limit/ores-rl-interfaces', '241353d0f5269450690d9646be03db2aba59a2ae'),
            'lru': ('ores-redis-lru-cache/ores-lru-redis-interfaces', '4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27'),
            'sharedAuth': ('shared-auth/shared-auth-interfaces', '52b7ac7fbf0c7c169684f613eda923f3aa6c82e9'),
            'rpc': ('ORESoftware/api-docs', '3fef5e4f273910d25383494c46eec532a4a2536c'),
            'flags2env': ('flags-2-env/flags-2-env', 'c7f720d7501921b5a1b42c395b5a6fe271f24332'),
            'tjsv': ('ORESoftware/typespec-json-schema-validator', 'a4b731fbf82c4d162abd74fd03758fa32bb76176'),
          }
          lock = json.loads(Path('.ores-config-authorities.json').read_text())
          if lock.get('schemaVersion') != 1:
            raise SystemExit('authority lock schemaVersion must be 1')
          for key, (repo, rev) in expected.items():
            item = lock.get('authorities', {}).get(key)
            if item != {'repository': repo, 'revision': rev}:
              raise SystemExit(f'authority lock mismatch for {key}')

          env_key = re.compile(r'^[A-Z_][A-Z0-9_]*$')
          required = ['.ores-mw.toml', '.ores-rl.toml', '.ores-lru.toml', '.ores-rpc.toml']
          docs = {}
          for path in required:
            p = Path(path)
            if not p.is_file() or p.is_symlink():
              raise SystemExit(f'{path} must be a regular committed file')
            docs[path] = tomllib.loads(p.read_text())

          auth_alias = Path('.auth-shared.toml')
          auth_canonical = Path('.shared-auth.toml')
          if auth_alias.exists() == auth_canonical.exists():
            raise SystemExit('exactly one of .auth-shared.toml or .shared-auth.toml must exist')
          auth_path = auth_canonical if auth_canonical.exists() else auth_alias
          if not auth_path.is_file() or auth_path.is_symlink():
            raise SystemExit('Shared Auth config must be a regular committed file')
          auth = tomllib.loads(auth_path.read_text())

          mw = docs['.ores-mw.toml']
          if mw.get('schema_version') != 1 or mw.get('repository_mode') != 'server-only':
            raise SystemExit('.ores-mw.toml must be server-only schema v1 in this fleet batch')
          targets = mw.get('targets')
          if not isinstance(targets, list) or not targets or any(t.get('role') != 'server' for t in targets):
            raise SystemExit('.ores-mw.toml targets must be non-empty server targets')

          rl = docs['.ores-rl.toml']
          if rl.get('schemaVersion') != 'ores.rate-limit.config.v1' or rl.get('layout') != 'server-only':
            raise SystemExit('.ores-rl.toml must use the server-only v1 contract')
          server = rl.get('server', {})
          for key in ('redisUrlEnv', 'keyHmacEnv'):
            value = server.get(key)
            if not isinstance(value, str) or not env_key.fullmatch(value):
              raise SystemExit(f'.ores-rl.toml {key} must name an environment variable')
          if any('://' in str(v) for v in server.values()):
            raise SystemExit('.ores-rl.toml must not contain a literal backend URL')
          policies = rl.get('policies', [])
          if not policies or rl.get('defaultPolicyId') not in {p.get('policyId') for p in policies}:
            raise SystemExit('.ores-rl.toml default policy must exist')

          lru = docs['.ores-lru.toml']
          if lru.get('protocol') != 'ores.lru-config.v1' or lru.get('roles') != ['server']:
            raise SystemExit('.ores-lru.toml must select server role explicitly')
          redis = lru.get('redis', {})
          if not env_key.fullmatch(str(redis.get('urlEnv', ''))):
            raise SystemExit('.ores-lru.toml redis.urlEnv must name an environment variable')
          if any('://' in str(v) for v in redis.values()):
            raise SystemExit('.ores-lru.toml must not contain a literal Redis URL')

          compat = auth.get('compatibility', {})
          if auth.get('schema_version') != 1 or compat.get('repository') != 'https://github.com/shared-auth/shared-auth-interfaces':
            raise SystemExit('Shared Auth compatibility authority is invalid')
          if compat.get('commit') != '52b7ac7fbf0c7c169684f613eda923f3aa6c82e9':
            raise SystemExit('Shared Auth config must pin the reviewed authority')

          rpc = docs['.ores-rpc.toml']
          if rpc.get('schema_version') != 1 or rpc.get('mode') != 'server' or rpc.get('strict') is not True:
            raise SystemExit('.ores-rpc.toml must be strict server schema v1')
          f2e = rpc.get('flags2env', {})
          if f2e != {'contract': '.cli-flags.toml', 'require_audit': True, 'precedence': 'argv-over-env'}:
            raise SystemExit('.ores-rpc.toml must use canonical flags-2-env precedence/audit')
          rpc_table = rpc.get('rpc', {})
          if rpc_table.get('request_validation') != 'tjsv' or rpc_table.get('response_validation') != 'tjsv':
            raise SystemExit('.ores-rpc.toml must require TJSV both directions')
          if not rpc_table.get('server_root') or 'client_root' in rpc_table:
            raise SystemExit('server RPC config requires only server_root')
          names, keys = set(), set()
          for binding in rpc.get('env', []):
            name, key = binding.get('name'), binding.get('key')
            if name in names or key in keys or not env_key.fullmatch(str(key or '')):
              raise SystemExit('duplicate or invalid RPC env binding')
            if binding.get('secret') is True and 'default' in binding:
              raise SystemExit('secret RPC env binding must not define a default')
            names.add(name); keys.add(key)

          fw = Path('.fanwaave-cfg.toml')
          if fw.exists():
            if fw.is_symlink():
              raise SystemExit('.fanwaave-cfg.toml must be a regular file')
            cfg = tomllib.loads(fw.read_text())
            if cfg.get('version') != 1 or cfg.get('mode') != 'server' or cfg.get('strict') is not True:
              raise SystemExit('.fanwaave-cfg.toml must be strict server v1 in server repos')
            f2e = cfg.get('flags2env', {})
            if f2e != {'contract': '.cli-flags.toml', 'require_audit': True, 'precedence': 'argv-over-env'}:
              raise SystemExit('Fanwaave config must bind canonical flags-2-env contract')
            if cfg.get('client', {}).get('enabled') is True or cfg.get('server', {}).get('enabled') is not True:
              raise SystemExit('Fanwaave server repo must not enable client runtime')
            seen = set()
            for binding in cfg.get('env', []):
              key = binding.get('key')
              if key in seen or not env_key.fullmatch(str(key or '')):
                raise SystemExit('Fanwaave env key invalid or duplicated')
              if binding.get('secret') is True and 'default' in binding:
                raise SystemExit('Fanwaave secret env binding must not define a default')
              seen.add(key)
          PY

      - name: Audit local CLI contract with canonical flags-2-env when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .cli-flags.toml ]]; then
            node .authority/flags2env/clients/nodejs/cli.mjs audit .cli-flags.toml > target/ores-config/flags2env-audit.json
          else
            printf '%s\n' '{"status":"not-applicable","reason":"repository has no argv surface contract"}' > target/ores-config/flags2env-audit.json
          fi

      - name: Normalize middleware consumer instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/mw-instances/MiddlewareManifest/valid
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          raw = tomllib.loads(Path('.ores-mw.toml').read_text())
          out = {
            'schemaVersion': raw['schema_version'],
            'repositoryMode': raw['repository_mode'],
            'allowOverlappingRoots': raw.get('allow_overlapping_roots', False),
            'targets': [],
          }
          if 'default_target' in raw: out['defaultTarget'] = raw['default_target']
          for t in raw['targets']:
            item = {
              'name': t['name'], 'role': t['role'], 'roots': t['roots'],
              'enabled': t.get('enabled', True), 'middleware': t['middleware'],
            }
            if 'stack_config' in t: item['stackConfig'] = t['stack_config']
            if 'propagate_headers' in t: item['propagateHeaders'] = t['propagate_headers']
            out['targets'].append(item)
          Path('target/mw-instances/MiddlewareManifest/valid/repo.json').write_text(json.dumps(out, indent=2) + '\n')
          PY

      - name: Re-admit middleware consumer through TJSV
        shell: bash
        run: |
          set -euo pipefail
          node .authority/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=.authority/middleware/contracts/ores-mw-config/typespec/main.tsp \
            --schema=.authority/middleware/contracts/ores-mw-config/json-schema/manifest.schema.json \
            --instances=target/mw-instances \
            --report=target/ores-config/middleware-report.json \
            --sarif=target/ores-config/middleware-report.sarif \
            --contract-ir=target/ores-config/middleware-ir.json \
            --output-dir=target/ores-config/middleware-generated \
            --max-probes=128 --int64-strategy=string --seal-object-schemas=true --polymorphic-models-strategy=oneOf

      - name: Normalize and re-admit RPC consumer through TJSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rpc-instances/OresRpcConfig/valid
          python3 .authority/rpc/scripts/ores_rpc_config.py .ores-rpc.toml --output target/rpc-instances/OresRpcConfig/valid/repo.json
          node .authority/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=.authority/rpc/idl/typespec/ores-rpc-config.tsp \
            --schema=.authority/rpc/json-schema/ores-rpc-config.schema.json \
            --instances=target/rpc-instances \
            --report=target/ores-config/rpc-report.json \
            --sarif=target/ores-config/rpc-report.sarif \
            --contract-ir=target/ores-config/rpc-ir.json \
            --output-dir=target/ores-config/rpc-generated \
            --max-probes=128 --int64-strategy=string --seal-object-schemas=true --polymorphic-models-strategy=oneOf

      - name: Record exact authorities
        shell: bash
        run: |
          set -euo pipefail
          git -C .authority/middleware rev-parse HEAD > target/ores-config/middleware-revision.txt
          git -C .authority/fanwaave rev-parse HEAD > target/ores-config/fanwaave-revision.txt
          git -C .authority/rpc rev-parse HEAD > target/ores-config/rpc-revision.txt
          git -C .authority/tjsv rev-parse HEAD > target/ores-config/tjsv-revision.txt
          git -C .authority/flags2env rev-parse HEAD > target/ores-config/flags2env-revision.txt

      - name: Retain config admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-config-contract-${{ github.repository_id }}-${{ github.sha }}
          path: target/ores-config/
          if-no-files-found: error
          retention-days: 30
