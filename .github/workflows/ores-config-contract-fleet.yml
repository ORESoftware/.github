name: ORES config contract fleet

on:
  workflow_call:
    inputs:
      expected_mode:
        description: "auto, client, server, or hybrid"
        required: false
        type: string
        default: auto
      required_configs:
        description: "Comma-separated subset of middleware,rate-limit,lru,shared-auth,rpc,fanwaave"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ores-config-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MW_REVISION: ee75f0a67cf23895500846402fbc757aa0686530
      FANWAAVE_REVISION: e27695091a5b8276543a6f435156a25043f297a9
      RATE_LIMIT_REVISION: 241353d0f5269450690d9646be03db2aba59a2ae
      LRU_REVISION: 4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27
      SHARED_AUTH_REVISION: 52b7ac7fbf0c7c169684f613eda923f3aa6c82e9
      RPC_REVISION: 802d655357ec4d4b3bb8ec07acb9250bc033b17c
      FLAGS2ENV_REVISION: c7f720d7501921b5a1b42c395b5a6fe271f24332
      TJSV_REVISION: a4b731fbf82c4d162abd74fd03758fa32bb76176
    steps:
      - name: Check out exact consumer candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Check out middleware authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-middleware
          ref: ee75f0a67cf23895500846402fbc757aa0686530
          path: .authority/middleware
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out Fanwaave authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fanwaave/fanwaave-interfaces
          ref: e27695091a5b8276543a6f435156a25043f297a9
          path: .authority/fanwaave
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out RPC authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/api-docs
          ref: 802d655357ec4d4b3bb8ec07acb9250bc033b17c
          path: .authority/rpc
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out immutable TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: a4b731fbf82c4d162abd74fd03758fa32bb76176
          path: .authority/tjsv
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out immutable flags-2-env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: flags-2-env/flags-2-env
          ref: c7f720d7501921b5a1b42c395b5a6fe271f24332
          path: .authority/flags2env
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install pinned contract runtimes including native flags-2-env boundary
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix .authority/tjsv --no-audit --no-fund
          npm ci --prefix .authority/flags2env --no-audit --no-fund

      - name: Materialize role-aware semantic validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ores-config
          cat > target/ores-config/validate.py <<'PY'
          from __future__ import annotations
          import argparse, json, re, tempfile, tomllib
          from pathlib import Path, PurePosixPath

          ENV_KEY = re.compile(r'^[A-Z_][A-Z0-9_]*$')
          ENV_NAME = re.compile(r'^[a-z][a-z0-9_]*$')
          EXPECTED = {
            'middleware': ('ORESoftware/ores-middleware', 'ee75f0a67cf23895500846402fbc757aa0686530'),
            'fanwaave': ('fanwaave/fanwaave-interfaces', 'e27695091a5b8276543a6f435156a25043f297a9'),
            'rateLimit': ('ores-rate-limit/ores-rl-interfaces', '241353d0f5269450690d9646be03db2aba59a2ae'),
            'lru': ('ores-redis-lru-cache/ores-lru-redis-interfaces', '4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27'),
            'sharedAuth': ('shared-auth/shared-auth-interfaces', '52b7ac7fbf0c7c169684f613eda923f3aa6c82e9'),
            'rpc': ('ORESoftware/api-docs', '802d655357ec4d4b3bb8ec07acb9250bc033b17c'),
            'flags2env': ('flags-2-env/flags-2-env', 'c7f720d7501921b5a1b42c395b5a6fe271f24332'),
            'tjsv': ('ORESoftware/typespec-json-schema-validator', 'a4b731fbf82c4d162abd74fd03758fa32bb76176'),
          }
          FILES = {
            'middleware': '.ores-mw.toml',
            'rate-limit': '.ores-rl.toml',
            'lru': '.ores-lru.toml',
            'rpc': '.ores-rpc.toml',
            'fanwaave': '.fanwaave-cfg.toml',
          }

          class Invalid(ValueError): pass
          def req(cond, msg):
            if not cond: raise Invalid(msg)
          def safe_root(value):
            req(isinstance(value, str) and value != '', 'root must be a non-empty string')
            p = PurePosixPath(value)
            req(not p.is_absolute() and '..' not in p.parts, f'unsafe root: {value}')
          def parse(path): return tomllib.loads(path.read_text())
          def binding_set(items, where):
            req(isinstance(items, list), f'{where}.env must be an array')
            names, keys = set(), set()
            for item in items:
              req(isinstance(item, dict), f'{where}.env items must be tables')
              name, key = item.get('name'), item.get('key')
              req(isinstance(name, str) and ENV_NAME.fullmatch(name), f'{where}: invalid env name {name!r}')
              req(isinstance(key, str) and ENV_KEY.fullmatch(key), f'{where}: invalid env key {key!r}')
              req(name not in names and key not in keys, f'{where}: duplicate env name/key')
              req(not (item.get('secret') is True and 'default' in item), f'{where}: secret env binding cannot have default')
              names.add(name); keys.add(key)
            return names
          def flags2env(doc, root, where):
            expected = {'contract': '.cli-flags.toml', 'require_audit': True, 'precedence': 'argv-over-env'}
            req(doc.get('flags2env') == expected, f'{where}: invalid flags2env boundary')
            p = root / '.cli-flags.toml'
            req(p.is_file() and not p.is_symlink(), f'{where}: .cli-flags.toml must exist and be regular')
          def roles_mode(roles):
            s = set(roles)
            req(s in ({'client'}, {'server'}, {'client','server'}), f'invalid role set {sorted(s)}')
            return 'hybrid' if len(s) == 2 else next(iter(s))

          def validate_mw(doc):
            req(doc.get('schema_version') == 1, 'middleware: schema_version must be 1')
            raw = doc.get('repository_mode')
            mode = {'client-only':'client','server-only':'server','hybrid':'hybrid'}.get(raw)
            req(mode is not None, 'middleware: invalid repository_mode')
            targets = doc.get('targets')
            req(isinstance(targets, list) and targets, 'middleware: targets required')
            role_roots = {'client': set(), 'server': set()}
            names = set()
            for t in targets:
              req(isinstance(t, dict), 'middleware: target must be table')
              name, role = t.get('name'), t.get('role')
              req(isinstance(name, str) and name and name not in names, 'middleware: target names must be unique')
              names.add(name)
              req(role in ('client','server'), 'middleware: target role invalid')
              roots = t.get('roots')
              req(isinstance(roots, list) and roots, 'middleware: roots required')
              for r in roots:
                safe_root(r); role_roots[role].add(r)
              kind = t.get('middleware')
              req(kind in ('stack','propagation-only','disabled'), 'middleware: invalid middleware mode')
              if role == 'client':
                req(kind != 'stack', 'middleware: client cannot install server middleware stack')
                req('stack_config' not in t, 'middleware: client cannot reference stack_config')
              if kind == 'stack': req(isinstance(t.get('stack_config'), str) and t['stack_config'], 'middleware: stack requires stack_config')
            observed = roles_mode([r for r,v in role_roots.items() if v])
            req(observed == mode, f'middleware: declared {mode} but observed {observed}')
            overlap = role_roots['client'] & role_roots['server']
            if overlap: req(doc.get('allow_overlapping_roots') is True, 'middleware: cross-role root overlap requires allow_overlapping_roots=true')
            return mode

          def validate_rl(doc):
            req(doc.get('schemaVersion') == 'ores.rate-limit.config.v1', 'rate-limit: schemaVersion invalid')
            layout = doc.get('layout')
            mode = {'client-only':'client','server-only':'server','combined':'hybrid'}.get(layout)
            req(mode is not None, 'rate-limit: layout invalid')
            client, server = doc.get('client'), doc.get('server')
            req((client is not None) == (mode in ('client','hybrid')), 'rate-limit: client projection mismatch')
            req((server is not None) == (mode in ('server','hybrid')), 'rate-limit: server projection mismatch')
            if client is not None:
              req(isinstance(client, dict), 'rate-limit: client must be table'); safe_root(client.get('root'))
              req(not any(k in client for k in ('redisUrlEnv','keyHmacEnv','backend')), 'rate-limit: client leaked server/backend settings')
            if server is not None:
              req(isinstance(server, dict), 'rate-limit: server must be table'); safe_root(server.get('root'))
              h = server.get('keyHmacEnv'); req(isinstance(h, str) and ENV_KEY.fullmatch(h), 'rate-limit: keyHmacEnv must name env variable')
              r = server.get('redisUrlEnv')
              if r is not None: req(isinstance(r, str) and ENV_KEY.fullmatch(r), 'rate-limit: redisUrlEnv must name env variable')
              req(not any('://' in str(v) for v in server.values()), 'rate-limit: literal backend URL forbidden')
            policies = doc.get('policies'); req(isinstance(policies, list) and policies, 'rate-limit: policies required')
            ids = [p.get('policyId') for p in policies if isinstance(p, dict)]
            req(len(ids) == len(set(ids)) and doc.get('defaultPolicyId') in ids, 'rate-limit: duplicate/missing default policy')
            return mode

          def validate_lru(doc):
            req(doc.get('protocol') == 'ores.lru-config.v1', 'lru: protocol invalid')
            roles = doc.get('roles'); req(isinstance(roles, list) and roles and len(roles) == len(set(roles)), 'lru: roles invalid')
            mode = roles_mode(roles)
            redis = doc.get('redis')
            if mode == 'client': req(redis is None, 'lru: client-only config cannot contain Redis block')
            if redis is not None:
              req(isinstance(redis, dict), 'lru: redis must be table')
              key = redis.get('urlEnv'); req(isinstance(key, str) and ENV_KEY.fullmatch(key), 'lru: redis.urlEnv must name env variable')
              req(not any('://' in str(v) for v in redis.values()), 'lru: literal Redis URL forbidden')
            caches = doc.get('caches'); req(isinstance(caches, list) and caches, 'lru: caches required')
            for c in caches:
              req(c.get('role') in roles, 'lru: cache role outside declared roles')
              if c.get('role') == 'client': req(c.get('syncMode', doc.get('defaults',{}).get('syncMode')) != 'read_write', 'lru: client cache cannot request read_write Redis mode')
            return mode

          def validate_rpc(doc, root):
            req(doc.get('schema_version') == 1 and doc.get('strict') is True, 'rpc: strict schema v1 required')
            mode = doc.get('mode'); req(mode in ('client','server','hybrid'), 'rpc: mode invalid')
            flags2env(doc, root, 'rpc')
            rpc = doc.get('rpc'); req(isinstance(rpc, dict), 'rpc: [rpc] required')
            req(rpc.get('request_validation') == 'tjsv' and rpc.get('response_validation') == 'tjsv', 'rpc: TJSV required in both directions')
            cr, sr = rpc.get('client_root'), rpc.get('server_root')
            req((cr is not None) == (mode in ('client','hybrid')), 'rpc: client_root projection mismatch')
            req((sr is not None) == (mode in ('server','hybrid')), 'rpc: server_root projection mismatch')
            if cr is not None: safe_root(cr)
            if sr is not None: safe_root(sr)
            if mode == 'hybrid': req(cr != sr, 'rpc: hybrid client_root and server_root must be distinct')
            binding_set(doc.get('env', []), 'rpc')
            return mode

          def validate_fanwaave(doc, root):
            req(doc.get('version') == 1 and doc.get('strict') is True, 'fanwaave: strict v1 required')
            mode = doc.get('mode'); req(mode in ('client','server','hybrid'), 'fanwaave: mode invalid')
            flags2env(doc, root, 'fanwaave')
            names = binding_set(doc.get('env', []), 'fanwaave')
            client, server = doc.get('client'), doc.get('server')
            req((client is not None and client.get('enabled') is True) == (mode in ('client','hybrid')), 'fanwaave: client projection mismatch')
            req((server is not None and server.get('enabled') is True) == (mode in ('server','hybrid')), 'fanwaave: server projection mismatch')
            for section in (client, server):
              if not isinstance(section, dict): continue
              for k,v in section.items():
                if k.endswith('_binding') and v is not None: req(v in names, f'fanwaave: unknown binding {v}')
            return mode

          def validate_shared_auth(doc):
            req(doc.get('schema_version') == 1, 'shared-auth: schema_version must be 1')
            compat = doc.get('compatibility'); req(isinstance(compat, dict), 'shared-auth: compatibility table required')
            req(compat.get('repository') == 'https://github.com/shared-auth/shared-auth-interfaces', 'shared-auth: wrong repository')
            req(compat.get('commit') == EXPECTED['sharedAuth'][1], 'shared-auth: exact reviewed authority commit required for this fleet tranche')
            factors = doc.get('factors', {})
            allowed_factors = {'totp','passkey','security-key','email-otp','sms-otp','backup-code'}
            for part in ('two_factor','three_factor'):
              block = factors.get(part)
              if isinstance(block, dict) and 'methods' in block:
                m = block['methods']; req(isinstance(m, list) and m and len(m)==len(set(m)) and set(m)<=allowed_factors, f'shared-auth: invalid {part} methods')
            pages = doc.get('pages',{}).get('show')
            if pages is not None:
              allowed_pages={'sign-in','sign-up','challenge','recovery','consent','error','signed-out'}
              req(isinstance(pages,list) and pages and len(pages)==len(set(pages)) and set(pages)<=allowed_pages, 'shared-auth: invalid pages')

          def validate_lock(root):
            p=root/'.ores-config-authorities.json'; req(p.is_file() and not p.is_symlink(), 'authority lock must be regular file')
            lock=json.loads(p.read_text()); req(lock.get('schemaVersion')==1, 'authority lock schemaVersion must be 1')
            auth=lock.get('authorities',{})
            for k,(repo,rev) in EXPECTED.items(): req(auth.get(k)=={'repository':repo,'revision':rev}, f'authority lock mismatch for {k}')

          def validate_root(root, expected_mode='auto', required=''):
            validate_lock(root)
            present={name for name,path in FILES.items() if (root/path).is_file()}
            alias=root/'.auth-shared.toml'; canonical=root/'.shared-auth.toml'
            req(not (alias.exists() and canonical.exists()), 'shared-auth: canonical and alias cannot coexist')
            if alias.is_file() or canonical.is_file(): present.add('shared-auth')
            req(present, 'no recognized ORES config files found')
            requested={x.strip() for x in required.split(',') if x.strip()}
            req(requested <= set(FILES)|{'shared-auth'}, f'unknown required config(s): {sorted(requested-(set(FILES)|{"shared-auth"}))}')
            req(requested <= present, f'missing required config(s): {sorted(requested-present)}')
            modes={}
            if 'middleware' in present: modes['middleware']=validate_mw(parse(root/FILES['middleware']))
            if 'rate-limit' in present: modes['rate-limit']=validate_rl(parse(root/FILES['rate-limit']))
            if 'lru' in present: modes['lru']=validate_lru(parse(root/FILES['lru']))
            if 'rpc' in present: modes['rpc']=validate_rpc(parse(root/FILES['rpc']),root)
            if 'fanwaave' in present: modes['fanwaave']=validate_fanwaave(parse(root/FILES['fanwaave']),root)
            if 'shared-auth' in present: validate_shared_auth(parse(canonical if canonical.is_file() else alias))
            if modes:
              req(len(set(modes.values()))==1, f'cross-family mode drift: {modes}')
              mode=next(iter(modes.values()))
              if expected_mode!='auto': req(mode==expected_mode, f'expected mode {expected_mode}, got {mode}')
            else: mode='unspecified'
            return {'status':'passed','mode':mode,'present':sorted(present),'modes':modes}

          def self_test():
            # Focused semantic regressions independent of repository checkout.
            valid_client_mw={'schema_version':1,'repository_mode':'client-only','targets':[{'name':'c','role':'client','roots':['.'],'middleware':'propagation-only'}]}
            valid_server_mw={'schema_version':1,'repository_mode':'server-only','targets':[{'name':'s','role':'server','roots':['.'],'middleware':'disabled'}]}
            valid_hybrid_mw={'schema_version':1,'repository_mode':'hybrid','allow_overlapping_roots':True,'targets':[{'name':'s','role':'server','roots':['.'],'middleware':'disabled'},{'name':'c','role':'client','roots':['.'],'middleware':'propagation-only'}]}
            assert validate_mw(valid_client_mw)=='client'
            assert validate_mw(valid_server_mw)=='server'
            assert validate_mw(valid_hybrid_mw)=='hybrid'
            bad=dict(valid_hybrid_mw); bad['allow_overlapping_roots']=False
            try: validate_mw(bad); raise AssertionError('overlap must fail')
            except Invalid: pass
            valid_client_lru={'protocol':'ores.lru-config.v1','roles':['client'],'defaults':{'syncMode':'local_only'},'caches':[{'name':'x','role':'client'}]}
            assert validate_lru(valid_client_lru)=='client'
            bad_lru={**valid_client_lru,'redis':{'urlEnv':'REDIS_URL'}}
            try: validate_lru(bad_lru); raise AssertionError('client Redis must fail')
            except Invalid: pass
            env=[{'name':'token','key':'TOKEN','kind':'string','required':False,'secret':True,'default':'x'}]
            try: binding_set(env,'test'); raise AssertionError('secret default must fail')
            except Invalid: pass
            valid_combined={'schemaVersion':'ores.rate-limit.config.v1','layout':'combined','defaultPolicyId':'p','client':{'root':'.','exposePolicyMetadata':True},'server':{'root':'.','backend':'local','enforcementLayer':'service','keyHmacEnv':'HMAC'},'policies':[{'policyId':'p'}]}
            assert validate_rl(valid_combined)=='hybrid'
            print('role-aware semantic self-test: 9 controls passed')

          ap=argparse.ArgumentParser(); ap.add_argument('--root',default='.'); ap.add_argument('--expected-mode',default='auto'); ap.add_argument('--required-configs',default=''); ap.add_argument('--output'); ap.add_argument('--self-test',action='store_true'); args=ap.parse_args()
          try:
            if args.self_test: self_test(); raise SystemExit(0)
            req(args.expected_mode in ('auto','client','server','hybrid'),'expected_mode invalid')
            report=validate_root(Path(args.root),args.expected_mode,args.required_configs)
            if args.output: Path(args.output).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
            print(json.dumps(report,sort_keys=True))
          except Invalid as e:
            report={'status':'failed','error':str(e)}
            if args.output: Path(args.output).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
            print(json.dumps(report,sort_keys=True)); raise SystemExit(2)
          PY

      - name: Exercise client/server/hybrid and negative semantic controls
        run: python3 target/ores-config/validate.py --self-test

      - name: Validate authority lock, role projections, env-name boundaries, and mode convergence
        run: >-
          python3 target/ores-config/validate.py
          --root .
          --expected-mode '${{ inputs.expected_mode }}'
          --required-configs '${{ inputs.required_configs }}'
          --output target/ores-config/semantic-report.json

      - name: Audit local CLI contract with canonical flags-2-env when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .cli-flags.toml ]]; then
            node .authority/flags2env/clients/nodejs/cli.mjs audit .cli-flags.toml > target/ores-config/flags2env-audit.json
          else
            printf '%s\n' '{"status":"not-applicable","reason":"repository has no argv surface contract"}' > target/ores-config/flags2env-audit.json
          fi

      - name: Normalize middleware consumer instance
        if: ${{ hashFiles('.ores-mw.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/mw-instances/MiddlewareManifest/valid
          python3 - <<'PY'
          import json,tomllib
          from pathlib import Path
          raw=tomllib.loads(Path('.ores-mw.toml').read_text())
          out={'schemaVersion':raw['schema_version'],'repositoryMode':raw['repository_mode'],'allowOverlappingRoots':raw.get('allow_overlapping_roots',False),'targets':[]}
          if 'default_target' in raw: out['defaultTarget']=raw['default_target']
          for t in raw['targets']:
            item={'name':t['name'],'role':t['role'],'roots':t['roots'],'enabled':t.get('enabled',True),'middleware':t['middleware']}
            if 'stack_config' in t:item['stackConfig']=t['stack_config']
            if 'propagate_headers' in t:item['propagateHeaders']=t['propagate_headers']
            out['targets'].append(item)
          Path('target/mw-instances/MiddlewareManifest/valid/repo.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Re-admit middleware consumer through TJSV
        if: ${{ hashFiles('.ores-mw.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node .authority/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=.authority/middleware/contracts/ores-mw-config/typespec/main.tsp \
            --schema=.authority/middleware/contracts/ores-mw-config/json-schema/manifest.schema.json \
            --instances=target/mw-instances \
            --report=target/ores-config/middleware-report.json \
            --sarif=target/ores-config/middleware-report.sarif \
            --contract-ir=target/ores-config/middleware-ir.json \
            --output-dir=target/ores-config/middleware-generated \
            --max-probes=128 --int64-strategy=string --seal-object-schemas=true --polymorphic-models-strategy=oneOf

      - name: Re-admit Fanwaave consumer through TJSV
        if: ${{ hashFiles('.fanwaave-cfg.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fanwaave-instances/FanwaaveConfig/valid
          python3 - <<'PY'
          import json,tomllib
          from pathlib import Path
          raw=tomllib.loads(Path('.fanwaave-cfg.toml').read_text())
          Path('target/fanwaave-instances/FanwaaveConfig/valid/repo.json').write_text(json.dumps(raw,indent=2,sort_keys=True)+'\n')
          PY
          node .authority/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=.authority/fanwaave/contracts/fanwaave-config/fanwaave-config.tsp \
            --schema=.authority/fanwaave/contracts/fanwaave-config/fanwaave-config.schema.json \
            --instances=target/fanwaave-instances \
            --report=target/ores-config/fanwaave-report.json \
            --sarif=target/ores-config/fanwaave-report.sarif \
            --contract-ir=target/ores-config/fanwaave-ir.json \
            --output-dir=target/ores-config/fanwaave-generated \
            --max-probes=128 --int64-strategy=string --seal-object-schemas=true --polymorphic-models-strategy=oneOf

      - name: Normalize and re-admit RPC consumer through TJSV
        if: ${{ hashFiles('.ores-rpc.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rpc-instances/OresRpcConfig/valid
          python3 .authority/rpc/scripts/ores_rpc_config.py .ores-rpc.toml --output target/rpc-instances/OresRpcConfig/valid/repo.json
          node .authority/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=.authority/rpc/idl/typespec/ores-rpc-config.tsp \
            --schema=.authority/rpc/json-schema/ores-rpc-config.schema.json \
            --instances=target/rpc-instances \
            --report=target/ores-config/rpc-report.json \
            --sarif=target/ores-config/rpc-report.sarif \
            --contract-ir=target/ores-config/rpc-ir.json \
            --output-dir=target/ores-config/rpc-generated \
            --max-probes=128 --int64-strategy=string --seal-object-schemas=true --polymorphic-models-strategy=oneOf

      - name: Record exact authority revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C .authority/middleware rev-parse HEAD > target/ores-config/middleware-revision.txt
          git -C .authority/fanwaave rev-parse HEAD > target/ores-config/fanwaave-revision.txt
          git -C .authority/rpc rev-parse HEAD > target/ores-config/rpc-revision.txt
          git -C .authority/tjsv rev-parse HEAD > target/ores-config/tjsv-revision.txt
          git -C .authority/flags2env rev-parse HEAD > target/ores-config/flags2env-revision.txt

      - name: Retain config admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-config-contract-${{ github.repository_id }}-${{ github.sha }}
          path: target/ores-config/
          if-no-files-found: error
          retention-days: 30
