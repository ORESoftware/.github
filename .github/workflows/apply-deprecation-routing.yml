name: Apply deprecation routing

on:
  push:
    branches:
      - chore/record-deprecated-repositories

permissions:
  contents: write

concurrency:
  group: apply-deprecation-routing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepend organization deprecation routing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          profile_marker = '<!-- ores-deprecated-repositories: 2026-09-01 -->'
          profile_banner = '''<!-- ores-deprecated-repositories: 2026-09-01 -->
          > [!IMPORTANT]
          > **Deprecated ORESoftware repositories**
          >
          > - [`ORESoftware/ai-agent-bridge.rs`](https://github.com/ORESoftware/ai-agent-bridge.rs) is superseded by [`agent-pontifex`](https://github.com/agent-pontifex).
          > - [`ORESoftware/shared-auth-server.rs`](https://github.com/ORESoftware/shared-auth-server.rs) is superseded by [`shared-auth`](https://github.com/shared-auth).
          >
          > New feature development belongs in the replacement organizations. The legacy repositories are limited to security, migration, and narrowly scoped compatibility work.

          '''

          agents_marker = '<!-- ores-deprecation-routing: 2026-09-01 -->'
          agents_banner = '''<!-- ores-deprecation-routing: 2026-09-01 -->
          # DEPRECATION ROUTING

          The following ORESoftware repositories are deprecated:

          - `ORESoftware/ai-agent-bridge.rs` → `https://github.com/agent-pontifex`
          - `ORESoftware/shared-auth-server.rs` → `https://github.com/shared-auth`

          Agents must route new feature work to the replacement organization. In a deprecated repository, work is restricted to security remediation, migration support, and narrowly scoped compatibility changes. Do not edit the replacement organization from a legacy-repository task unless that repository is separately named in the task.

          '''

          def prepend(path: Path, marker: str, banner: str) -> None:
              current = path.read_text(encoding='utf-8') if path.exists() else ''
              if marker not in current:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(banner + current, encoding='utf-8')

          prepend(Path('profile/README.md'), profile_marker, profile_banner)
          prepend(Path('AGENTS.md'), agents_marker, agents_banner)
          PY

          rm -- .github/workflows/apply-deprecation-routing.yml
          git config user.name 'ores-gh-bots'
          git config user.email 'ores-gh-bots@users.noreply.github.com'
          git add profile/README.md AGENTS.md .github/workflows/apply-deprecation-routing.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs: route deprecated repositories to replacements'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
