name: den-3959-canonical-rpc-gate-patch

on:
  push:
    branches:
      - den-3959-reusable-config-contracts
    paths:
      - '.github/workflows/den-3959-canonical-rpc-gate-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-3959-reusable-config-contracts
          persist-credentials: true
          fetch-depth: 1
          show-progress: false
      - name: Reconcile reusable gate with merged api-docs RPC authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/ores-config-contract-fleet.yml')
          text = p.read_text()
          old_rpc = '802d655357ec4d4b3bb8ec07acb9250bc033b17c'
          new_rpc = '12127a82ff1c0c34096faaf6df1a2a8484ea2feb'
          rpc_tjsv = 'd60d0d79d83e075077382623ec9e23a401ab601f'
          if old_rpc not in text:
              raise SystemExit('old RPC candidate pin not found')
          text = text.replace(old_rpc, new_rpc)

          env_anchor = '      TJSV_REVISION: a4b731fbf82c4d162abd74fd03758fa32bb76176\n'
          if env_anchor not in text:
              raise SystemExit('TJSV env anchor missing')
          text = text.replace(env_anchor, env_anchor + f'      RPC_TJSV_REVISION: {rpc_tjsv}\n', 1)

          dict_anchor = "            'tjsv': ('ORESoftware/typespec-json-schema-validator', 'a4b731fbf82c4d162abd74fd03758fa32bb76176'),\n"
          if dict_anchor not in text:
              raise SystemExit('authority dict anchor missing')
          text = text.replace(dict_anchor, dict_anchor + f"            'rpcTjsv': ('ORESoftware/typespec-json-schema-validator', '{rpc_tjsv}'),\n", 1)

          start = text.index('          def validate_rpc(doc, root):\n')
          end = text.index('          def validate_fanwaave(doc, root):\n', start)
          replacement = '''          def validate_rpc(doc, root):
            # Deep RPC semantics are delegated to the merged api-docs loader in a
            # separate exact-revision workflow step. This local projection exists
            # only to participate in cross-family client/server/hybrid mode checks.
            req(doc.get('schemaVersion') == 'ores.rpc.config.v1', 'rpc: schemaVersion invalid')
            req(doc.get('strict') is True, 'rpc: strict=true required')
            mode = {'client-only':'client','server-only':'server','hybrid':'hybrid'}.get(doc.get('repositoryMode'))
            req(mode is not None, 'rpc: repositoryMode invalid')
            targets = doc.get('targets')
            req(isinstance(targets, list) and targets, 'rpc: targets required')
            roles = {t.get('role') for t in targets if isinstance(t, dict)}
            expected_roles = {'client','server'} if mode == 'hybrid' else {mode}
            req(roles == expected_roles, f'rpc: repository role mismatch: {sorted(roles)}')
            return mode

'''
          text = text[:start] + replacement + text[end:]

          checkout_anchor = '''      - name: Check out immutable flags-2-env
'''
          if checkout_anchor not in text:
              raise SystemExit('flags checkout anchor missing')
          rpc_checkout = f'''      - name: Check out RPC-certified TJSV revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: {rpc_tjsv}
          path: .authority/tjsv-rpc
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

'''
          text = text.replace(checkout_anchor, rpc_checkout + checkout_anchor, 1)

          install_anchor = '          npm ci --prefix .authority/tjsv --no-audit --no-fund\n'
          if install_anchor not in text:
              raise SystemExit('install anchor missing')
          text = text.replace(install_anchor, install_anchor + '          npm ci --prefix .authority/tjsv-rpc --no-audit --no-fund\n', 1)

          validate_anchor = '''      - name: Validate authority lock, role projections, env-name boundaries, and mode convergence
'''
          if validate_anchor not in text:
              raise SystemExit('semantic validation anchor missing')
          expr = '$' + "{{ hashFiles('.ores-rpc.toml') != '' }}"
          rpc_semantic = f'''      - name: Validate RPC through merged api-docs semantic loader
        if: {expr}
        shell: bash
        run: |
          set -euo pipefail
          python3 .authority/rpc/scripts/ores_rpc_config.py --manifest .ores-rpc.toml --repo-root . check

'''
          text = text.replace(validate_anchor, rpc_semantic + validate_anchor, 1)

          rpc_step_start = text.index('      - name: Normalize and re-admit RPC consumer through TJSV\n')
          rpc_step_end = text.index('      - name: Record exact authority revisions\n', rpc_step_start)
          rpc_expr = '$' + "{{ hashFiles('.ores-rpc.toml') != '' }}"
          rpc_step = f'''      - name: Normalize and re-admit RPC consumer through certified TJSV
        if: {rpc_expr}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rpc-instances/OresRpcConfigV1/valid
          python3 .authority/rpc/scripts/ores_rpc_config.py \\
            --manifest .ores-rpc.toml --repo-root . normalize \\
            > target/rpc-instances/OresRpcConfigV1/valid/repo.json
          node .authority/tjsv-rpc/bin/typespec-json-schema-validator.mjs check \\
            --typespec=.authority/rpc/contracts/ores-rpc-config/typespec/main.tsp \\
            --schema=.authority/rpc/contracts/ores-rpc-config/json-schema/ores-rpc-config.schema.json \\
            --mapping=.authority/rpc/contracts/ores-rpc-config/tjsv.mapping.json \\
            --instances=target/rpc-instances \\
            --report=target/ores-config/rpc-report.json \\
            --sarif=target/ores-config/rpc-report.sarif \\
            --contract-ir=target/ores-config/rpc-ir.json \\
            --output-dir=target/ores-config/rpc-generated \\
            --int64-strategy=number --seal-object-schemas=true --polymorphic-models-strategy=oneOf

'''
          text = text[:rpc_step_start] + rpc_step + text[rpc_step_end:]

          record_anchor = '          git -C .authority/tjsv rev-parse HEAD > target/ores-config/tjsv-revision.txt\n'
          if record_anchor not in text:
              raise SystemExit('revision record anchor missing')
          text = text.replace(record_anchor, record_anchor + '          git -C .authority/tjsv-rpc rev-parse HEAD > target/ores-config/rpc-tjsv-revision.txt\n', 1)

          p.write_text(text)

          # Update the self-test fixture authority ledger to the merged RPC closure.
          s = Path('.github/workflows/ores-config-contract-fleet-selftest.yml')
          st = s.read_text().replace(old_rpc, new_rpc)
          fixture_anchor = "            'tjsv': ('ORESoftware/typespec-json-schema-validator', 'a4b731fbf82c4d162abd74fd03758fa32bb76176'),\n"
          if fixture_anchor not in st:
              raise SystemExit('selftest authority fixture anchor missing')
          st = st.replace(fixture_anchor, fixture_anchor + f"            'rpcTjsv': ('ORESoftware/typespec-json-schema-validator', '{rpc_tjsv}'),\n", 1)
          s.write_text(st)
          PY
          rm .github/workflows/den-3959-canonical-rpc-gate-patch.yml
      - name: Sanity-check YAML payload and RPC lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fleet=Path('.github/workflows/ores-config-contract-fleet.yml').read_text()
          test=Path('.github/workflows/ores-config-contract-fleet-selftest.yml').read_text()
          for required in [
            '12127a82ff1c0c34096faaf6df1a2a8484ea2feb',
            'd60d0d79d83e075077382623ec9e23a401ab601f',
            '.authority/rpc/scripts/ores_rpc_config.py',
            'contracts/ores-rpc-config/typespec/main.tsp',
            'contracts/ores-rpc-config/json-schema/ores-rpc-config.schema.json',
            'contracts/ores-rpc-config/tjsv.mapping.json',
          ]:
            if required not in fleet:
              raise SystemExit(f'missing canonical RPC gate element: {required}')
          if '802d655357ec4d4b3bb8ec07acb9250bc033b17c' in fleet + test:
            raise SystemExit('superseded RPC candidate pin survived')
          print('canonical merged RPC closure wired into fleet gate')
          PY
      - name: Commit reconciled reusable gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ores-config-contract-fleet.yml .github/workflows/ores-config-contract-fleet-selftest.yml .github/workflows/den-3959-canonical-rpc-gate-patch.yml
          git commit -m 'DEN-3959: bind fleet gate to merged RPC authority'
          git push origin HEAD:den-3959-reusable-config-contracts
