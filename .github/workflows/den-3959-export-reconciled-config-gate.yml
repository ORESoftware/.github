name: den-3959-export-reconciled-config-gate

on:
  push:
    branches: [den-3959-reusable-config-contracts]
    paths:
      - '.github/workflows/den-3959-export-reconciled-config-gate.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-3959-reusable-config-contracts
          persist-credentials: true
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Produce reconciled workflow bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/den-3959-reconcile-config-gate.py')
          text=p.read_text()
          old='''    if "doc.get('schema_version')" in fleet or "doc.get('mode')" in fleet:\n        raise SystemExit('superseded #81 RPC dialect survived reusable gate')\n'''
          new='''    rpc_start = fleet.index('          def validate_rpc(doc, root):\\n')\n    rpc_end = fleet.index('          def validate_fanwaave(doc, root):\\n', rpc_start)\n    rpc_block = fleet[rpc_start:rpc_end]\n    if "doc.get('schema_version')" in rpc_block or "doc.get('mode')" in rpc_block:\n        raise SystemExit('superseded #81 RPC dialect survived reusable RPC validator')\n'''
          if old not in text:
              raise SystemExit('transient postcondition anchor missing')
          p.write_text(text.replace(old,new,1))
          PY
          python3 -m py_compile scripts/den-3959-reconcile-config-gate.py
          python3 scripts/den-3959-reconcile-config-gate.py
          mkdir -p generated/den-3959
          cp .github/workflows/ores-config-contract-fleet.yml generated/den-3959/ores-config-contract-fleet.yml
          cp .github/workflows/ores-config-contract-fleet-selftest.yml generated/den-3959/ores-config-contract-fleet-selftest.yml
          git checkout -- .github/workflows/ores-config-contract-fleet.yml .github/workflows/ores-config-contract-fleet-selftest.yml scripts/den-3959-reconcile-config-gate.py
          python3 - <<'PY'
          from pathlib import Path
          fleet=Path('generated/den-3959/ores-config-contract-fleet.yml').read_text()
          test=Path('generated/den-3959/ores-config-contract-fleet-selftest.yml').read_text()
          required=[
            '12127a82ff1c0c34096faaf6df1a2a8484ea2feb',
            'd60d0d79d83e075077382623ec9e23a401ab601f',
            '.authority/rpc/scripts/ores_rpc_config.py',
            'contracts/ores-rpc-config/tjsv.mapping.json',
          ]
          missing=[x for x in required if x not in fleet]
          if missing: raise SystemExit(f'export missing canonical RPC elements: {missing}')
          if '802d655357ec4d4b3bb8ec07acb9250bc033b17c' in fleet+test:
            raise SystemExit('export retained superseded RPC pin')
          print('validated reconciled workflow export')
          PY
      - name: Publish ordinary generated blobs for connector promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/den-3959/ores-config-contract-fleet.yml generated/den-3959/ores-config-contract-fleet-selftest.yml
          git commit -m 'DEN-3959: export reconciled config gate blobs'
          git push origin HEAD:den-3959-reusable-config-contracts
