name: den-3959-run-config-reconciler

on:
  push:
    branches: [den-3959-reusable-config-contracts]
    paths:
      - 'scripts/den-3959-reconcile-config-gate.py'
      - '.github/workflows/den-3959-run-config-reconciler.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-3959-reusable-config-contracts
          persist-credentials: true
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile and syntax-check
        run: |
          python3 -m py_compile scripts/den-3959-reconcile-config-gate.py
          python3 scripts/den-3959-reconcile-config-gate.py
      - name: Remove one-shot helpers and commit
        run: |
          rm .github/workflows/den-3959-canonical-rpc-gate-patch.yml
          rm .github/workflows/den-3959-run-config-reconciler.yml
          rm scripts/den-3959-reconcile-config-gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/ores-config-contract-fleet.yml .github/workflows/ores-config-contract-fleet-selftest.yml .github/workflows/den-3959-canonical-rpc-gate-patch.yml .github/workflows/den-3959-run-config-reconciler.yml scripts/den-3959-reconcile-config-gate.py
          git commit -m 'DEN-3959: bind fleet gate to merged RPC authority'
          git push origin HEAD:den-3959-reusable-config-contracts
