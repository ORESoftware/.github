name: Deprecation routing guard

on:
  pull_request:
  push:
    branches:
      - main
      - chore/record-deprecated-repositories

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify deprecated repositories remain explicitly routed
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          expectations = {
              Path('profile/README.md'): (
                  '<!-- ores-deprecated-repositories: 2026-09-01 -->',
                  ('https://github.com/agent-pontifex', 'https://github.com/shared-auth'),
              ),
              Path('AGENTS.md'): (
                  '<!-- ores-deprecation-routing: 2026-09-01 -->',
                  ('https://github.com/agent-pontifex', 'https://github.com/shared-auth'),
              ),
          }

          for path, (marker, replacements) in expectations.items():
              if not path.is_file():
                  raise SystemExit(f'{path} is required')
              text = path.read_text(encoding='utf-8')
              if not text.startswith(marker):
                  raise SystemExit(f'{path} must begin with {marker}')
              prefix = text[:3000]
              for replacement in replacements:
                  if replacement not in prefix:
                      raise SystemExit(f'{path} must name {replacement} near the top')
          PY
