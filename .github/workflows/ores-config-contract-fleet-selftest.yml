name: ORES config fleet selftest

on:
  pull_request:
    paths:
      - '.github/workflows/ores-config-contract-fleet.yml'
      - '.github/workflows/ores-config-contract-fleet-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Extract the exact embedded semantic validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/ores-config-contract-fleet.yml').read_text()
          start_marker = "cat > target/ores-config/validate.py <<'PY'\n"
          start = src.find(start_marker)
          if start < 0:
              raise SystemExit('embedded validator start marker missing')
          start += len(start_marker)
          end = src.find("\n          PY\n", start)
          if end < 0:
              raise SystemExit('embedded validator end marker missing')
          lines = src[start:end].splitlines()
          normalized = []
          for line in lines:
              if line == '':
                  normalized.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected validator indentation: {line!r}')
              normalized.append(line[10:])
          Path('/tmp/ores-config-validate.py').write_text('\n'.join(normalized) + '\n')
          PY
          python3 -m py_compile /tmp/ores-config-validate.py
      - name: Run focused client/server/hybrid and negative controls
        run: python3 /tmp/ores-config-validate.py --self-test
      - name: Run full-root client server hybrid matrix and fail-closed mutations
        run: |
          python3 - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path

          VALIDATOR = '/tmp/ores-config-validate.py'
          REQUIRED = 'middleware,rate-limit,lru,shared-auth'
          pins = {
            'middleware': ('ORESoftware/ores-middleware', 'ee75f0a67cf23895500846402fbc757aa0686530'),
            'fanwaave': ('fanwaave/fanwaave-interfaces', 'e27695091a5b8276543a6f435156a25043f297a9'),
            'rateLimit': ('ores-rate-limit/ores-rl-interfaces', '241353d0f5269450690d9646be03db2aba59a2ae'),
            'lru': ('ores-redis-lru-cache/ores-lru-redis-interfaces', '4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27'),
            'sharedAuth': ('shared-auth/shared-auth-interfaces', '52b7ac7fbf0c7c169684f613eda923f3aa6c82e9'),
            'rpc': ('ORESoftware/api-docs', '12127a82ff1c0c34096faaf6df1a2a8484ea2feb'),
            'flags2env': ('flags-2-env/flags-2-env', 'c7f720d7501921b5a1b42c395b5a6fe271f24332'),
            'tjsv': ('ORESoftware/typespec-json-schema-validator', 'a4b731fbf82c4d162abd74fd03758fa32bb76176'),
            'rpcTjsv': ('ORESoftware/typespec-json-schema-validator', 'd60d0d79d83e075077382623ec9e23a401ab601f'),
          }
          lock = {'schemaVersion': 1, 'authorities': {k: {'repository': r, 'revision': s} for k,(r,s) in pins.items()}}
          shared = '''schema_version = 1
          [compatibility]
          repository = "https://github.com/shared-auth/shared-auth-interfaces"
          commit = "52b7ac7fbf0c7c169684f613eda923f3aa6c82e9"
          [factors.two_factor]
          required = false
          methods = ["totp", "passkey"]
          [factors.three_factor]
          enabled = false
          methods = ["totp", "passkey"]
          [pages]
          show = ["sign-in", "challenge", "error"]
          '''
          policy = '''[[policies]]
          policyId = "p"
          clientVisible = true
          algorithm = "fixed-window"
          identityScope = "anonymous-ip"
          capacity = 10
          windowMs = 1000
          refillTokens = 0
          refillIntervalMs = 0
          requestCost = 1
          enforcementMode = "observe-only"
          consistencyMode = "advisory"
          backendFailureMode = "fail-open"
          denyCacheMode = "local-denials"
          denyCacheCapacity = 0
          maxOvershoot = 0
          maxBlockTtlMs = 1000
          keyVersion = "v1"
          policyVersion = 1
          '''

          def run(root, mode, expected=0, required=REQUIRED):
              cp = subprocess.run([
                  'python3', VALIDATOR, '--root', str(root), '--expected-mode', mode,
                  '--required-configs', required,
              ], text=True, capture_output=True)
              if cp.returncode != expected:
                  raise SystemExit(f'{root.name}/{mode}: expected exit {expected}, got {cp.returncode}: {cp.stdout} {cp.stderr}')
              return cp

          def write_base(root):
              (root / '.ores-config-authorities.json').write_text(json.dumps(lock, indent=2) + '\n')
              (root / '.auth-shared.toml').write_text(shared)

          with tempfile.TemporaryDirectory() as td:
              base = Path(td)

              client = base / 'client'; client.mkdir(); write_base(client)
              (client / '.ores-mw.toml').write_text('''schema_version = 1
              repository_mode = "client-only"
              [[targets]]
              name = "client"
              role = "client"
              roots = ["."]
              middleware = "propagation-only"
              propagate_headers = ["traceparent", "baggage"]
              ''')
              (client / '.ores-rl.toml').write_text('''schemaVersion = "ores.rate-limit.config.v1"
              layout = "client-only"
              defaultPolicyId = "p"
              [client]
              root = "."
              exposePolicyMetadata = true
              ''' + policy)
              (client / '.ores-lru.toml').write_text('''protocol = "ores.lru-config.v1"
              namespace = "fixture-client"
              roles = ["client"]
              [defaults]
              capacity = 32
              syncMode = "local_only"
              overflowMode = "evict_lru"
              failOpenOnStartup = false
              [[caches]]
              name = "runtime-env"
              role = "client"
              ''')
              run(client, 'client')

              server = base / 'server'; server.mkdir(); write_base(server)
              (server / '.ores-mw.toml').write_text('''schema_version = 1
              repository_mode = "server-only"
              [[targets]]
              name = "server"
              role = "server"
              roots = ["."]
              middleware = "disabled"
              ''')
              (server / '.ores-rl.toml').write_text('''schemaVersion = "ores.rate-limit.config.v1"
              layout = "server-only"
              defaultPolicyId = "p"
              [server]
              root = "."
              backend = "local"
              enforcementLayer = "service"
              keyHmacEnv = "ORES_RL_HMAC_KEY"
              ''' + policy)
              (server / '.ores-lru.toml').write_text('''protocol = "ores.lru-config.v1"
              namespace = "fixture-server"
              roles = ["server"]
              [redis]
              urlEnv = "REDIS_URL"
              keyPrefix = "ores:lru:fixture-server"
              pubsubChannel = "ores:lru:fixture-server:events"
              reconcileIntervalMs = 180000
              reconnectMinMs = 1000
              reconnectMaxMs = 30000
              [defaults]
              capacity = 64
              syncMode = "read_only"
              overflowMode = "reject_and_reconcile"
              failOpenOnStartup = false
              [[caches]]
              name = "runtime-env"
              role = "server"
              ''')
              run(server, 'server')

              hybrid = base / 'hybrid'; hybrid.mkdir(); write_base(hybrid)
              (hybrid / '.ores-mw.toml').write_text('''schema_version = 1
              repository_mode = "hybrid"
              allow_overlapping_roots = true
              [[targets]]
              name = "server"
              role = "server"
              roots = ["."]
              middleware = "disabled"
              [[targets]]
              name = "client"
              role = "client"
              roots = ["."]
              middleware = "propagation-only"
              ''')
              (hybrid / '.ores-rl.toml').write_text('''schemaVersion = "ores.rate-limit.config.v1"
              layout = "combined"
              defaultPolicyId = "p"
              [client]
              root = "."
              exposePolicyMetadata = true
              [server]
              root = "."
              backend = "local"
              enforcementLayer = "service"
              keyHmacEnv = "ORES_RL_HMAC_KEY"
              ''' + policy)
              (hybrid / '.ores-lru.toml').write_text('''protocol = "ores.lru-config.v1"
              namespace = "fixture-hybrid"
              roles = ["client", "server"]
              [redis]
              urlEnv = "REDIS_URL"
              keyPrefix = "ores:lru:fixture-hybrid"
              pubsubChannel = "ores:lru:fixture-hybrid:events"
              reconcileIntervalMs = 180000
              reconnectMinMs = 1000
              reconnectMaxMs = 30000
              [defaults]
              capacity = 64
              syncMode = "local_only"
              overflowMode = "evict_lru"
              failOpenOnStartup = false
              [[roleOverrides]]
              role = "server"
              syncMode = "read_only"
              overflowMode = "reject_and_reconcile"
              [[caches]]
              name = "runtime-env"
              role = "client"
              [[caches]]
              name = "runtime-env"
              role = "server"
              syncMode = "read_only"
              ''')
              run(hybrid, 'hybrid')

              # Cross-family drift: hybrid middleware/rate-limit but server-only LRU must fail.
              (hybrid / '.ores-lru.toml').write_text((server / '.ores-lru.toml').read_text())
              run(hybrid, 'hybrid', expected=2)

              # Dual Shared Auth filenames are ambiguous and must fail closed.
              (client / '.shared-auth.toml').write_text(shared)
              run(client, 'client', expected=2)
              (client / '.shared-auth.toml').unlink()

              # Stale authority pin must fail before policy evaluation.
              stale = json.loads((client / '.ores-config-authorities.json').read_text())
              stale['authorities']['tjsv']['revision'] = '0' * 40
              (client / '.ores-config-authorities.json').write_text(json.dumps(stale))
              run(client, 'client', expected=2)

              # Required config omissions are explicit failures, not silent N/A.
              missing = base / 'missing'; missing.mkdir()
              (missing / '.ores-config-authorities.json').write_text(json.dumps(lock))
              (missing / '.ores-mw.toml').write_text((server / '.ores-mw.toml').read_text())
              run(missing, 'server', expected=2)

          print('full-root role matrix and 4 fail-closed mutations passed')
          PY
      - name: Static reusable-workflow safety assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ores-config-contract-fleet.yml').read_text()
          required = [
              'expected_mode:',
              'required_configs:',
              "hashFiles('.ores-mw.toml')",
              "hashFiles('.ores-rpc.toml')",
              "hashFiles('.fanwaave-cfg.toml')",
              'client-only', 'server-only', 'hybrid', 'combined',
              'secret env binding cannot have default',
              'cross-family mode drift',
              'client-only config cannot contain Redis block',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing reusable-workflow guardrails: {missing}')
          forbidden = [
              ".ores-mw.toml must be server-only",
              ".ores-rl.toml must use the server-only",
              ".ores-rpc.toml must be strict server",
          ]
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(f'server-only rollout assumptions survived: {found}')
          print('reusable workflow role/mode static checks passed')
          PY
