name: ORES config fleet selftest

on:
  pull_request:
    paths:
      - '.github/workflows/ores-config-contract-fleet.yml'
      - '.github/workflows/ores-config-contract-fleet-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Extract the exact embedded semantic validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/ores-config-contract-fleet.yml').read_text()
          start_marker = "cat > target/ores-config/validate.py <<'PY'\n"
          start = src.find(start_marker)
          if start < 0:
              raise SystemExit('embedded validator start marker missing')
          start += len(start_marker)
          end = src.find("\n          PY\n", start)
          if end < 0:
              raise SystemExit('embedded validator end marker missing')
          lines = src[start:end].splitlines()
          normalized = []
          for line in lines:
              if line == '':
                  normalized.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected validator indentation: {line!r}')
              normalized.append(line[10:])
          Path('/tmp/ores-config-validate.py').write_text('\n'.join(normalized) + '\n')
          PY
          python3 -m py_compile /tmp/ores-config-validate.py
      - name: Run client/server/hybrid and negative controls
        run: python3 /tmp/ores-config-validate.py --self-test
      - name: Static reusable-workflow safety assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ores-config-contract-fleet.yml').read_text()
          required = [
              'expected_mode:',
              'required_configs:',
              "hashFiles('.ores-mw.toml')",
              "hashFiles('.ores-rpc.toml')",
              "hashFiles('.fanwaave-cfg.toml')",
              'client-only', 'server-only', 'hybrid', 'combined',
              'secret env binding cannot have default',
              'cross-family mode drift',
              'client-only config cannot contain Redis block',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing reusable-workflow guardrails: {missing}')
          forbidden = [
              ".ores-mw.toml must be server-only",
              ".ores-rl.toml must use the server-only",
              ".ores-rpc.toml must be strict server",
          ]
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(f'server-only rollout assumptions survived: {found}')
          print('reusable workflow role/mode static checks passed')
          PY
