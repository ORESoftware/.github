name: Scratch directory ignore policy
description: Compile and test the bundled Rust checker against the caller's directory-only scratch ignores.

runs:
  using: composite
  steps:
    - name: Install pinned minimal Rust toolchain
      shell: bash
      run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
    - name: Compile and exercise the immutable bundled checker
      shell: bash
      env:
        CHECKER_SOURCE: ${{ github.action_path }}/../../../scratch_ignore_check.rs
      run: |
        set -euo pipefail
        mkdir -p tmp/scratch-ignore-policy
        rustup run 1.85.1 rustc --edition=2021 -D warnings --test "$CHECKER_SOURCE" -o tmp/scratch-ignore-policy/tests
        tmp/scratch-ignore-policy/tests
        rustup run 1.85.1 rustc --edition=2021 -D warnings "$CHECKER_SOURCE" -o tmp/scratch-ignore-policy/check
    - name: Verify argument refusal and actual caller policy
      shell: bash
      run: |
        set -euo pipefail
        set +e
        tmp/scratch-ignore-policy/check --unsupported >tmp/scratch-ignore-policy/argv.log 2>&1
        status=$?
        set -e
        test "$status" -eq 2
        tmp/scratch-ignore-policy/check
