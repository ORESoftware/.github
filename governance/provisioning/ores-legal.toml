[contracts]
typespec = "independent-authority"
jsonSchema = "independent-authority"
parityValidator = "tjsv"
generatedReadmeRequired = true
maintainedLanguages = [
  "rust",
  "typescript",
  "javascript",
  "dart",
  "go",
  "gleam",
  "java",
  "kotlin",
  "swift",
  "csharp",
  "python",
  "ruby",
  "php",
  "cpp",
  "elixir",
  "wit",
]

[platform]
authentication = ["shared-auth", "3FA-app"]
middleware = ["ores-middleware", "ores-rate-limit"]
runtimeConfiguration = ["ores-redis-lru-cache", "ores-sops"]
observability = ["ores-otel"]
synchronization = ["opto-sync"]
dependencies = ["zed-pkg"]
cliFlags = ["flags-2-env"]
chat = ["ores-chat"]
wasmPreparation = ["ores-wasm-loaders"]
