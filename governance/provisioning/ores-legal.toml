schemaVersion = "ores.repository-family-provisioning.v1"
organization = "ores-legal"
trackingIssue = "ORESoftware/.github#32"
linearProject = "ores-legal"
status = "blocked"
reviewedAt = "2026-09-07T21:46:53Z"
blocker = "Production organization is not exposed to the connected GitHub App and the connector has no repository-creation mutation. Use the guarded ores-cli bootstrap only after exact-head tests pass and an authenticated organization-admin path is available."

[[repositories]]
